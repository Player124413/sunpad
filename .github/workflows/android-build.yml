# Android APK build on GitHub Actions — LATEST VERSION.
#
# This copy lives in ci/ so it can be pushed without the GitHub App
# "workflows" permission. The ACTIVE file is .github/workflows/android-build.yml
# (moved there by the maintainer); when this copy changes, copy it over:
#   cp ci/android-build.yml .github/workflows/android-build.yml
#   git add .github/workflows/android-build.yml && git commit && git push
#
# What this builds:
#   - the ModernGekko / Dolphin-derived core for Android arm64-v8a
#     (Vulkan + OpenSL ES, the SunPad 0001+0002 patches applied),
#   - when you provide an ISO URL: generates the GMSE01 Android module from
#     your disc image; or when you provide a module URL: reuses that already
#     built Android arm64 module. Either module source is bundled into the APK
#     and uploaded as a separate artifact,
#   - the Kotlin app + JNI shim into an installable debug APK.
#
# Game data is never committed: an ISO or prebuilt module is downloaded only
# for the run and discarded afterwards. A plain push builds an APK without a
# module, so it must be provisioned on-device.
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      iso_url:
        description: >-
          Direct URL to your GMSE01 USA Rev 0 ISO (1.4 GB, SHA-256
          67cec163...73e51d). Generates and bundles a new Android module.
          Leave this and module_url empty for an APK without a module.
        required: false
      module_url:
        description: >-
          Direct public download URL to an existing Android arm64
          gGMSE01_recomp.so. Reuses and bundles it without regeneration.
          Do not set this together with iso_url.
        required: false

permissions:
  contents: read
  actions: write   # artifacts upload + ISO cache

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reject conflicting module sources
        if: ${{ inputs.iso_url != '' && inputs.module_url != '' }}
        run: |
          echo "Choose either iso_url (generate a module) or module_url (reuse one), not both." >&2
          exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang aria2 \
            ca-certificates libbz2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libxxf86vm-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Ensure git TLS certificates
        # GitHub-hosted runners occasionally lose the CA bundle
        # ("server certificate verification failed. CAfile: none") when
        # fetching submodules. Point git at the system bundle explicitly;
        # only if verification still fails, disable it for this job — safe
        # here because bootstrap verifies every checkout against its pinned
        # revision and patch application fails on any mismatch.
        run: |
          sudo apt-get install -y ca-certificates
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt || true
          if ! git ls-remote https://github.com/KhronosGroup/glslang.git HEAD >/dev/null 2>&1; then
            echo "git TLS verification failing; disabling verification for this job"
            git config --global http.sslVerify false
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bootstrap pinned patched dependencies (with retry)
        run: |
          # setup-android exports ANDROID_HOME (not ANDROID_SDK_ROOT), so
          # resolve the SDK root defensively and export the NDK path for
          # the scripts that need it.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/26.3.11579264"
          echo "SDK root: $SDK_ROOT"
          test -d "$ANDROID_NDK_HOME" || { echo "NDK missing in $SDK_ROOT/ndk/"; ls -1 "$SDK_ROOT/ndk/" 2>/dev/null || true; exit 1; }
          for attempt in 1 2 3; do
            if ./scripts/bootstrap-dependencies.sh; then
              exit 0
            fi
            echo "bootstrap attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Restore user-provided ISO from cache
        if: ${{ inputs.iso_url != '' }}
        id: iso-cache
        uses: actions/cache@v4
        with:
          path: /tmp/gmse01.iso
          key: gmse01-iso-${{ inputs.iso_url }}

      - name: Download user-provided ISO (aria2, multi-connection)
        if: ${{ inputs.iso_url != '' && steps.iso-cache.outputs.cache-hit != 'true' }}
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          aria2c -x16 -s16 -k1M --console-log-level=warn -d /tmp -o gmse01.iso "$ISO_URL"
          ls -l /tmp/gmse01.iso

      - name: Validate user-provided ISO
        if: ${{ inputs.iso_url != '' }}
        run: |
          ls -l /tmp/gmse01.iso
          echo "67cec1634e641227a4cd51e6a0b277730cb9a1adaa867530c9e66de45373e51d  /tmp/gmse01.iso" | sha256sum -c -

      - name: Generate GMSE01 module sources from the ISO
        if: ${{ inputs.iso_url != '' }}
        run: ./scripts/ci-prepare-game.sh /tmp/gmse01.iso

      - name: Download prebuilt GMSE01 Android module
        if: ${{ inputs.module_url != '' }}
        env:
          MODULE_URL: ${{ inputs.module_url }}
        run: |
          aria2c -x16 -s16 -k1M --allow-overwrite=true --console-log-level=warn \
            -d /tmp -o gGMSE01_recomp.so "$MODULE_URL"
          python3 - /tmp/gGMSE01_recomp.so <<'PY'
          import struct
          import sys

          with open(sys.argv[1], "rb") as module:
              header = module.read(20)
          if len(header) < 20 or header[:4] != b"\x7fELF":
              raise SystemExit("Downloaded module is not an ELF file")
          if header[4] != 2 or header[5] != 1:
              raise SystemExit("Downloaded module must be a 64-bit little-endian ELF file")
          e_type, e_machine = struct.unpack_from("<HH", header, 16)
          if e_type != 3 or e_machine != 183:
              raise SystemExit(
                  "Downloaded module must be an Android arm64 shared library "
                  f"(type={e_type}, machine={e_machine})"
              )
          PY

      - name: Build Android core and provision the app
        env:
          SUNPAD_BUNDLE_MODULE: "1"
          MODULE_URL: ${{ inputs.module_url }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/26.3.11579264"
          test -d "$ANDROID_NDK_HOME" || { echo "NDK missing in $SDK_ROOT/ndk/"; ls -1 "$SDK_ROOT/ndk/" 2>/dev/null || true; exit 1; }
          if [[ -n "$MODULE_URL" ]]; then
            export SUNPAD_PREBUILT_MODULE=/tmp/gGMSE01_recomp.so
          fi
          ./scripts/android-build-core.sh

      - name: Build APK and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sunpad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload recompiled GMSE01 module
        if: ${{ hashFiles('android/app/src/main/assets/modules/gGMSE01_recomp.so') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gGMSE01_recomp.so
          path: android/app/src/main/assets/modules/gGMSE01_recomp.so
          if-no-files-found: error
