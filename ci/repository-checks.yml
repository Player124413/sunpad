# NOTE: this workflow is temporarily parked outside .github/workflows/ so
# that changes to it can be pushed without the GitHub App "workflows"
# permission. Move it back to .github/workflows/repository-checks.yml to
# re-enable CI; the android-patches job is already included.
name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Repository safety and focused tests
        run: ./scripts/check-repository.sh

  android-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Android runtime patches reproduce from pinned revisions
        run: SUNPAD_NETWORK_TESTS=1 ./tests/test-android-patches.sh

  patch-reproducibility:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Recreate pinned patched dependencies
        run: ./scripts/bootstrap-dependencies.sh
      - name: Configure patched Simulator runtime
        run: >-
          cmake -S ref/ModernGekko -B ref/ModernGekko/build-ci-ios -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/scripts/ios-simulator-toolchain.cmake"
          -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=OFF -DENABLE_TESTS=OFF
          -DUSE_DISCORD_PRESENCE=OFF -DUSE_MGBA=OFF
          -DUSE_RETRO_ACHIEVEMENTS=OFF -DENABLE_AUTOUPDATE=OFF
          -DENABLE_ANALYTICS=OFF -DUSE_UPNP=OFF
          -DMODERNGEKKO_ENABLE_DOLPHIN_TESTS=OFF
          -DENABLE_CUBEB=OFF -DENABLE_VULKAN=OFF
          -DUSE_SYSTEM_LZ4=OFF -DUSE_SYSTEM_ZSTD=OFF
          -DHAVE_PIPE2=0
      - name: Compile patched Simulator runtime
        run: cmake --build ref/ModernGekko/build-ci-ios --target libmoderngekko.a -j8
