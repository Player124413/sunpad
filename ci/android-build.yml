# Android APK build on GitHub Actions.
#
# NOTE: this workflow is parked outside .github/workflows/ so that changes
# to it can be pushed without the GitHub App "workflows" permission. Move
# it to .github/workflows/android-build.yml to activate it.
#
# What this builds:
#   - the ModernGekko / Dolphin-derived core for Android arm64-v8a
#     (Vulkan + OpenSL ES, the SunPad 0001+0002 patches applied),
#   - the Kotlin app + JNI shim into an installable debug APK.
# What it does NOT build: the GMSE01 recompiled module and game data are
# never in CI (they come from the user's own disc via scripts/prepare-game.sh
# and are imported on-device).
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and platform
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Bootstrap pinned patched dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: ./scripts/bootstrap-dependencies.sh

      - name: Build Android core and provision the app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: ./scripts/android-build-core.sh

      - name: Build APK and run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sunpad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
